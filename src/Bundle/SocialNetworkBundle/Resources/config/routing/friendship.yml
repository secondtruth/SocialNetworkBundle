    defaults: { _controller: 'Kiboko\Bundle\SocialNetworkBundle\Controller\FriendshipController::addAction' }

kiboko_social_network_friendship_invit:
    path:  /{userId}/invit
    defaults: { _controller: 'Kiboko\Bundle\SocialNetworkBundle\Controller\FriendshipController::invitAction' }

kiboko_social_network_friendship_accept:
    path:  /{userId}/accept
    defaults: { _controller: 'Kiboko\Bundle\SocialNetworkBundle\Controller\FriendshipController::acceptAction' }

kiboko_social_network_friendship_refuse:
    path:  /{userId}/refuse

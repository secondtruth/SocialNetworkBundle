    path:  /{userId}/show
    defaults: { _controller: 'Kiboko\Bundle\SocialNetworkBundle\Controller\ProfileController::showAction' }

kiboko_social_network_friendship_search_to_add:
    path:  /searchToAdd
    defaults: { _controller: 'Kiboko\Bundle\SocialNetworkBundle\Controller\FriendshipController::searchToAddAction' }

kiboko_social_network_friendship_search:
